name: TimeLapse Pro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyflakes pytest
      - name: Syntax check edge
        run: |
          python -m py_compile edge/agent.py
          python -m py_compile edge/upload/headend_client.py
          python -m py_compile edge/utils/database.py
          echo "Edge syntax OK"
      - name: Syntax check headend
        run: |
          python -m py_compile headend/main.py
          python -m py_compile headend/database.py
          echo "Headend syntax OK"
      - name: Agent integrity tests
        run: pytest tests/test_agent_integrity.py -v
      - name: Headend endpoint tests
        run: pytest tests/test_headend_endpoints.py -v

  ui-check:
    name: Web UI Build Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: timelapse-ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build check
        run: npm run build

  deploy-signal:
    name: Signal Deploy
    runs-on: ubuntu-latest
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy signal
        run: |
          echo "✅ Alle checks OK"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🕐 Tidspunkt: $(date -u)"
          echo "Pi 5 henter ny kode inden for 1 minut"
          echo "Edge enheder opdaterer inden for 5 min"

  deploy-macmini:
    name: Deploy to Mac mini Headend
    runs-on: self-hosted
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Pull latest code
        run: |
          cd ~/projects/timelapse-pro
          git pull origin main
      - name: Restart headend
        run: |
          sudo launchctl stop dk.froekjaer.timelapse-headend
          sudo launchctl start dk.froekjaer.timelapse-headend
          echo "✅ Headend genstartet"
      - name: Rebuild UI
        run: |
          cd ~/projects/timelapse-pro/timelapse-ui
          npm install --silent
          npm run build
          echo "✅ UI bygget"
      - name: Signal edge nodes to update
        run: |
          cd ~/projects/timelapse-pro/headend
          source venv/bin/activate
          python3 deploy/signal_edge_update.py
          echo "✅ Edge enheder signaleret"
