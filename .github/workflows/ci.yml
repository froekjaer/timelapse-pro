name: TimeLapse Pro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyflakes
      - name: Syntax check edge
        run: |
          python -m py_compile edge/agent.py
          python -m py_compile edge/upload/headend_client.py
          python -m py_compile edge/utils/database.py
          echo "Edge syntax OK"
      - name: Syntax check headend
        run: |
          python -m py_compile headend/main.py
          python -m py_compile headend/database.py
          echo "Headend syntax OK"

  deploy-signal:
    name: Signal Deploy
    runs-on: ubuntu-latest
    needs: [ python-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy signal
        run: |
          echo "Alle checks OK"
          echo "Commit ${{ github.sha }}"
          echo "Pi 5 henter ny kode inden for 1 minut"
