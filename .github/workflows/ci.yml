name: TimeLapse Pro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r headend/requirements.txt -r edge/requirements.txt
      - name: Syntax check all tracked Python
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          echo "All tracked Python syntax OK"
      - name: Syntax check all tracked shell scripts
        shell: bash
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            if [ -f "$f" ]; then
              bash -n "$f" || rc=1
            else
              echo "skip (unresolved path/symlink): $f"
            fi
          done < <(git ls-files -z '*.sh')
          echo "All tracked shell syntax checked"
          exit $rc
      - name: Unit and contract tests
        env:
          TIMELAPSE_TEST_DATABASE_URL: sqlite:////tmp/timelapse-ci.db
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/headend:${{ github.workspace }}/edge
        run: |
          pytest tests headend/tests edge/ai/tests \
            --import-mode=importlib -m "not integration" -p no:randomly -q

  ui-check:
    name: Web UI Build Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: timelapse-ui
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint gate (H-02 — ingen nye fejl)
        run: npm run lint:gate
      - name: Build check
        run: npm run build

  deploy-signal:
    name: Signal Deploy
    runs-on: ubuntu-latest
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy signal
        run: |
          echo "✅ Alle checks OK"
          echo "📦 Exact deploy commit: ${{ github.sha }}"
          echo "🕐 Tidspunkt: $(date -u)"
          echo "Headend deployes af self-hosted Mac mini runner"
          echo "Edge-opdateringer håndteres via signerede artifacts/change tickets"

  deploy-macmini:
    name: Deploy to Mac mini Headend
    runs-on: self-hosted
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Ryd macOS Icon metadata fra lokal repo
        run: |
          cd ~/projects/timelapse-pro
          if [ -x tools/cleanup_macos_icon_files.sh ]; then
            tools/cleanup_macos_icon_files.sh .
          else
            find .git -name $'Icon\r' -type f -exec rm -f {} + 2>/dev/null || true
            find . \
              -path ./.git -prune -o \
              -path ./.venv -prune -o \
              -path ./venv -prune -o \
              -path ./headend/venv -prune -o \
              -path ./node_modules -prune -o \
              -path ./timelapse-ui/node_modules -prune -o \
              -path ./timelapse-ui/dist -prune -o \
              -name $'Icon\r' -type f -size 0 -exec rm -f {} + 2>/dev/null || true
            echo "Removed macOS Icon metadata file(s) using inline fallback"
          fi

      - name: Record previous revision and checkout exact workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          cd ~/projects/timelapse-pro
          git fetch --prune origin main
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "❌ Lokal deploy-repo har tracked ændringer. Stopper før checkout."
            git status --short --untracked-files=no
            exit 1
          fi
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$PREVIOUS_SHA" > "$RUNNER_TEMP/timelapse-previous-sha"
          git cat-file -e "${{ github.sha }}^{commit}"
          git checkout --detach "${{ github.sha }}"
          git reset --hard "${{ github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "${{ github.sha }}" ]; then
            echo "❌ Checkout mismatch: expected ${{ github.sha }}, got $ACTUAL_SHA"
            exit 1
          fi
          echo "✅ Deploy target bound exactly to workflow SHA $ACTUAL_SHA"
          echo "ℹ️ Previous deploy revision: $PREVIOUS_SHA"

      - name: Build UI for target revision before backend restart
        run: |
          cd ~/projects/timelapse-pro/timelapse-ui
          npm ci --silent
          npm run build
          echo "✅ UI built for exact target revision"

      - name: Restart Headend and verify health or rollback
        shell: bash
        run: |
          set -euo pipefail
          REPO="$HOME/projects/timelapse-pro"
          PREVIOUS_SHA="$(cat "$RUNNER_TEMP/timelapse-previous-sha")"
          TARGET_SHA="${{ github.sha }}"

          restart_headend() {
            sudo launchctl kickstart -k "system/dk.froekjaer.timelapse-headend"
            sudo launchctl print "system/dk.froekjaer.timelapse-headend" \
              | grep -E "state =|pid =|last exit code =" || true
          }

          health_ok() {
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 5 \
                   http://127.0.0.1:8000/api/health >/dev/null; then
                return 0
              fi
              echo "Health check attempt $attempt/6 failed; waiting..."
              sleep 2
            done
            return 1
          }

          restart_headend
          if health_ok; then
            echo "✅ Headend health verified on exact deploy revision $TARGET_SHA"
            exit 0
          fi

          echo "❌ Target revision failed Headend health check; rolling back application code to $PREVIOUS_SHA"
          cd "$REPO"
          git checkout --detach "$PREVIOUS_SHA"
          git reset --hard "$PREVIOUS_SHA"
          cd "$REPO/timelapse-ui"
          npm ci --silent
          npm run build
          restart_headend

          if health_ok; then
            echo "✅ Automatic application rollback succeeded; restored $PREVIOUS_SHA"
          else
            echo "❌ CRITICAL: rollback revision also failed health check"
          fi
          exit 1

      - name: Skip legacy edge update signalling
        run: |
          echo "ℹ️ Legacy git-baseret Edge update-signalering er deaktiveret."
          echo "ℹ️ Edge-opdateringer skal oprettes som signerede Headend artifacts/change tickets og godkendes via update governance-flowet."
          echo "✅ Headend deploy færdig uden legacy Edge signalering"
