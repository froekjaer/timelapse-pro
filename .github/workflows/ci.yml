name: TimeLapse Pro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  python-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pyflakes pytest
          fi
      - name: Syntax check edge
        run: |
          python -m py_compile edge/agent.py
          python -m py_compile edge/upload/headend_client.py
          python -m py_compile edge/utils/database.py
          echo "Edge syntax OK"
      - name: Syntax check headend
        run: |
          python -m py_compile headend/main.py
          python -m py_compile headend/database.py
          echo "Headend syntax OK"
      - name: Agent integrity tests
        run: pytest tests/test_agent_integrity.py -v
      - name: Headend endpoint tests
        run: pytest tests/test_headend_endpoints.py -v
      - name: Daily smoke suite
        run: pytest tests/test_smoke_suite.py -m smoke -v

  ui-check:
    name: Web UI Build Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: timelapse-ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint gate (H-02 — ingen nye fejl)
        run: npm run lint:gate
      - name: Build check
        run: npm run build

  deploy-signal:
    name: Signal Deploy
    runs-on: ubuntu-latest
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy signal
        run: |
          echo "✅ Alle checks OK"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🕐 Tidspunkt: $(date -u)"
          echo "Headend deployes af self-hosted Mac mini runner"
          echo "Edge-opdateringer håndteres via signerede artifacts/change tickets"

  deploy-macmini:
    name: Deploy to Mac mini Headend
    runs-on: self-hosted
    needs: [ python-check, ui-check ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Ryd macOS Icon metadata fra lokal repo
        run: |
          cd ~/projects/timelapse-pro
          if [ -x tools/cleanup_macos_icon_files.sh ]; then
            tools/cleanup_macos_icon_files.sh .
          else
            find .git -name $'Icon\r' -type f -exec rm -f {} + 2>/dev/null || true
            find . -path ./.git -prune -o -name $'Icon\r' -type f -size 0 -exec rm -f {} + 2>/dev/null || true
            echo "Removed macOS Icon metadata file(s) using inline fallback"
          fi
      - name: Verificér GPG-signatur på seneste tag
        run: |
          cd ~/projects/timelapse-pro
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "⚠️  Ingen tags fundet — springer signaturcheck over"
          else
            echo "Verificerer tag: $LATEST_TAG"
            git tag -v "$LATEST_TAG" && echo "✅ GPG signatur OK: $LATEST_TAG" || { echo "❌ FEJL: Ugyldig GPG signatur på $LATEST_TAG"; exit 1; }
          fi

      - name: Pull latest code
        run: |
          cd ~/projects/timelapse-pro
          git pull origin main
      - name: Restart headend
        run: |
          # Brug sudo launchctl til global service (runner kører i eget domæne)
          sudo launchctl kickstart -k "dk.froekjaer.timelapse-headend"
          sudo launchctl print "dk.froekjaer.timelapse-headend" | grep -E "state =|pid =|last exit code =" || true
          echo "✅ Headend genstartet"
      - name: Rebuild UI
        run: |
          cd ~/projects/timelapse-pro/timelapse-ui
          npm install --silent
          npm run build
          echo "✅ UI bygget"
      - name: Skip legacy edge update signalling
        run: |
          echo "ℹ️ Legacy git-baseret Edge update-signalering er deaktiveret."
          echo "ℹ️ Edge-opdateringer skal oprettes som signerede Headend artifacts/change tickets og godkendes via update governance-flowet."
          echo "✅ Headend deploy færdig uden legacy Edge signalering"
