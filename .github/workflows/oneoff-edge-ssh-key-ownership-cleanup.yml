name: One-off Edge SSH ownership cleanup

on:
  push:
    branches:
      - security/closure-edge-ssh-private-key-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('headend/main.py')
          source = path.read_text(encoding='utf-8')

          # Generic key management: Edge SSH identities are public-key registration only.
          route_start = '@app.post("/api/admin/key-management/credentials")'
          route_end = '@app.post("/api/admin/key-management/credentials/{credential_id}/revoke")'
          if source.count(route_start) != 1 or source.count(route_end) != 1:
              raise SystemExit('key-management route markers changed')
          a = source.index(route_start)
          b = source.index(route_end, a)
          block = source[a:b]
          anchor = '    private_key_once = None\n'
          if block.count(anchor) != 1:
              raise SystemExit(f'key-management insertion anchor count={block.count(anchor)}')
          guard = (
              '    if entity_type == "edge" and key_type == "ssh":\n'
              '        if payload.generate_keypair:\n'
              '            raise HTTPException(\n'
              '                status_code=409,\n'
              '                detail="Edge SSH private keys skal genereres lokalt på Edge; registrér en Edge-leveret public key.",\n'
              '            )\n'
              '        if not (payload.public_key or "").strip():\n'
              '            raise HTTPException(status_code=400, detail="Edge-leveret public key er påkrævet for Edge SSH identity")\n'
              '\n'
          )
          block = block.replace(anchor, guard + anchor, 1)
          source = source[:a] + block + source[b:]

          # Remove dead private-key variables/messages from the two image-builder paths.
          exact_replacements = {
              '            _device_ssh_privkey = ""\n': '',
              '                    _device_ssh_privkey = ""  # private key is generated on Edge, never read from Headend DB\n': '',
              '        ssh_private_key: str | None = None\n': '',
              '                    ssh_private_key    = None  # private key is generated on Edge\n': '',
              '            ssh_configured=bool(ssh_private_key),\n': '            ssh_configured=False,\n',
              '        # Hent SSH-parametre fra Camera hvis camera_id er angivet\n': '        # Hent kun ikke-private SSH metadata fra Camera hvis camera_id er angivet.\n',
              '            # ── Hent SSH-nøgler fra kamera-DB ────────────────────────────────\n': '            # ── Hent ikke-private service metadata; Edge private keys forbliver lokale. ──\n',
          }
          for old, new in exact_replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'cleanup anchor count={source.count(old)} for {old!r}')
              source = source.replace(old, new, 1)

          msg_start = '                    if _device_ssh_privkey:\n'
          msg_end = '                finally:\n'
          if source.count(msg_start) != 1:
              raise SystemExit(f'legacy image message start count={source.count(msg_start)}')
          a = source.index(msg_start)
          b = source.index(msg_end, a)
          source = source[:a] + '                    progress(f"   🔑 Kamera \'{_cam_name}\': Edge-ejet SSH identity; Headend injicerer ingen privat nøgle")\n' + source[b:]

          dead_start = '        if ssh_private_key:\n'
          dead_end = '        db_url = db_factory()\n'
          if source.count(dead_start) != 1:
              raise SystemExit(f'dead SSH inject message count={source.count(dead_start)}')
          a = source.index(dead_start)
          b = source.index(dead_end, a)
          source = source[:a] + source[b:]

          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify focused contracts
        shell: bash
        run: |
          python3 -m py_compile headend/main.py
          python3 -m pip install -q pytest pytest-asyncio
          python3 -m pytest tests/test_security_closure_edge_ssh_private_key_ownership.py -q
          git diff --check
      - name: Commit product cleanup
        shell: bash
        run: |
          if git diff --quiet -- headend/main.py; then
            echo "No product changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headend/main.py
          git commit -m "Enforce Edge-owned SSH identity registration"
          git push origin HEAD:security/closure-edge-ssh-private-key-ownership
