name: One-off F-002 OS builder patch

on:
  push:
    branches: [security/closure-os-builder-f002]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/closure-os-builder-f002
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-match patch
        run: python tools/oneoff_patch_f002.py
      - name: Compile patched builder
        run: python -m py_compile headend/main.py headend/services/os_builder_security.py
      - name: Verify private builder permissions
        run: pytest -q tests/test_os_builder_security.py -k 'workspace_is_private or files_are_private'
      - name: Verify command construction
        run: pytest -q tests/test_os_builder_security.py -k 'command_keeps'
      - name: Verify unsafe inputs fail closed
        run: pytest -q tests/test_os_builder_security.py -k 'unsafe_builder_control_values'
      - name: Verify main.py integration
        run: pytest -q tests/test_os_builder_security.py -k 'reported_f002_builders'
      - name: Remove one-off machinery and commit result
        run: |
          rm .github/workflows/oneoff-f002-os-builder.yml tools/oneoff_patch_f002.py
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden OS builder inputs and workspace permissions'
          git push origin HEAD:security/closure-os-builder-f002
