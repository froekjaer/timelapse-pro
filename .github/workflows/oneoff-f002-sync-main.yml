name: One-off F-002 current-main sync

on:
  push:
    branches: [security/closure-os-builder-f002]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/closure-os-builder-f002
          fetch-depth: 0
      - name: Merge current main into closure branch
        run: |
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/oneoff-f002-sync-main.yml
          git add -A
          git commit -m 'Remove one-off F-002 branch sync workflow'
          git push origin HEAD:security/closure-os-builder-f002
