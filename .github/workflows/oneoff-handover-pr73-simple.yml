# retrigger registered workflow
name: One-off PR73 handover writer

on:
  push:
    branches:
      - security/closure-edge-ssh-private-key-ownership

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/oneoff_write_handover_pr73.py
      - run: git diff --check
      - name: Commit handover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dokumentation/HANDOVER_LOG.md
          git commit -m "Document Edge SSH ownership closure handover"
          git push origin HEAD:security/closure-edge-ssh-private-key-ownership
