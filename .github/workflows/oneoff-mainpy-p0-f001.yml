name: One-off main.py P0 and F-001 patch

on:
  push:
    branches:
      - security/closure-mainpy-p0-f001

permissions:
  contents: write

jobs:
  patch-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: security/closure-mainpy-p0-f001

      - name: Apply exact-match security patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("headend/main.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(label: str, old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "F-001 base TOTP fallback",
              '        # BT PAN TOTP — prioritet: fabriksstandard < global (Settings) <\n',
              '        # BT PAN TOTP — prioritet: unprovisioned < global (Settings) <\n',
          )
          replace_once(
              "F-001 shared factory secret",
              '            else {"secret": "JBSWY3DPEHPK3PXP", "sid": "factory-default"}\n',
              '            else {"secret": "", "sid": "unprovisioned"}\n',
          )
          replace_once(
              "F-001 final merged config gate",
              '    # bt_totp er sat som base + overrides via hierarkiet — intet ekstra her.\n\n    return cfg\n',
              '    from services.local_service_security import enforce_local_service_totp_provisioning\n'
              '    enforce_local_service_totp_provisioning(cfg)\n\n'
              '    return cfg\n',
          )

          replace_once(
              "SEC-ZAI-01 preview image confinement",
              '    path = _sftp_base_path() / "_lab" / device_id / filename\n',
              '    from services.path_security import UnsafePath, resolve_lab_preview_path\n'
              '    try:\n'
              '        path = resolve_lab_preview_path(_sftp_base_path(), device_id, filename)\n'
              '    except UnsafePath:\n'
              '        raise HTTPException(status_code=400, detail="Invalid preview path")\n',
          )
          replace_once(
              "SEC-ZAI-01 preview thumbnail source confinement",
              '    sftp_base = _sftp_base_path()\n    src = sftp_base / "_lab" / device_id / filename\n',
              '    from services.path_security import UnsafePath, resolve_lab_preview_path\n'
              '    sftp_base = _sftp_base_path()\n'
              '    try:\n'
              '        src = resolve_lab_preview_path(sftp_base, device_id, filename)\n'
              '    except UnsafePath:\n'
              '        raise HTTPException(status_code=400, detail="Invalid preview path")\n',
          )
          replace_once(
              "SEC-ZAI-01 preview thumbnail confinement",
              '    thumb = sftp_base / "_lab" / device_id / ".thumbs" / filename\n',
              '    thumb = resolve_lab_preview_path(sftp_base, device_id, filename, thumbnail=True)\n',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile patched files
        run: |
          python -m py_compile \
            headend/main.py \
            headend/services/path_security.py \
            headend/services/local_service_security.py

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TimeLapse Security Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-mainpy-p0-f001.yml
          git add headend/main.py
          git diff --cached --check
          git commit -m "Close LAB preview traversal and shared TOTP fallback"
          git push origin HEAD:security/closure-mainpy-p0-f001
