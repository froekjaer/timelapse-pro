name: One-off main.py ratchet cleanup

on:
  push:
    branches:
      - security/closure-mainpy-p0-f001

permissions:
  contents: write

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: security/closure-mainpy-p0-f001
      - name: Remove one redundant line and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('headend/main.py')
          s = p.read_text(encoding='utf-8')
          old = '    enforce_local_service_totp_provisioning(cfg)\n\n    return cfg\n'
          new = '    enforce_local_service_totp_provisioning(cfg)\n    return cfg\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one exact ratchet match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile headend/main.py
          test "$(wc -l < headend/main.py | tr -d ' ')" -le 18661
          git config user.name "TimeLapse Security Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-mainpy-ratchet.yml
          git add headend/main.py
          git diff --cached --check
          git commit -m "Keep security closure within architecture ratchet"
          git push origin HEAD:security/closure-mainpy-p0-f001
