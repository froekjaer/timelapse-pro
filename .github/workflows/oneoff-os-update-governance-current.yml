name: One-off OS update governance closure

on:
  push:
    branches: [security/os-update-governance-closure]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/os-update-governance-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact governance patch
        run: python tools/oneoff_patch_os_update_governance_current.py
      - name: Compile and verify focused contracts
        run: |
          python -m py_compile headend/main.py headend/cmdb.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('tests/test_os_update_governance_closure.py')
          spec = importlib.util.spec_from_file_location('osgov', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tests = [
              mod.test_cmdb_os_inventory_is_observation_only_not_deployable_pending_work,
              mod.test_existing_cmdb_observation_is_forced_back_to_blocked,
              mod.test_auto_os_bundle_builder_requires_explicit_lab_plan_evidence,
          ]
          for test in tests:
              test()
          print(f'{len(tests)} OS governance contracts passed')
          PY
      - name: Remove one-off machinery and commit result
        run: |
          rm .github/workflows/oneoff-os-update-governance-current.yml tools/oneoff_patch_os_update_governance_current.py
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make Edge OS inventory observation-only until lab plan exists'
          git push origin HEAD:security/os-update-governance-closure
