name: One-off recover Mac mini deploy checkout

on:
  push:
    branches:
      - ops/recover-macmini-deploy-checkout-2026-08-16

permissions:
  contents: read

jobs:
  recover:
    runs-on: self-hosted
    steps:
      - name: Verify feature work is remote and restore deploy anchor
        shell: bash
        run: |
          set -euo pipefail
          REPO="$HOME/projects/timelapse-pro"
          LAST_DEPLOYED="b96a4ac8ad0d78c58d5eebf4f8996490e56084e9"
          EXPECTED_FEATURE_HEAD="e08ab1d7d89a329bcd89dd414665e4c1a3197d0b"
          FEATURE_BRANCH="feature/exposure-ramping-2026-08-16"
          BACKUP_ROOT="$HOME/timelapse-deploy-wip-backups"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_DIR="$BACKUP_ROOT/$STAMP"

          cd "$REPO"
          git fetch --prune origin main "$FEATURE_BRANCH"

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_FEATURE_HEAD="$(git rev-parse "origin/$FEATURE_BRANCH")"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_FEATURE_HEAD" ]; then
            echo "❌ Refusing recovery: local HEAD=$ACTUAL_HEAD, expected feature head $EXPECTED_FEATURE_HEAD"
            exit 1
          fi
          if [ "$REMOTE_FEATURE_HEAD" != "$EXPECTED_FEATURE_HEAD" ]; then
            echo "❌ Refusing recovery: remote feature head=$REMOTE_FEATURE_HEAD, expected $EXPECTED_FEATURE_HEAD"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "❌ Refusing recovery: tracked changes still exist after feature work was committed"
            git status --short --untracked-files=no
            exit 1
          fi
          if ! git merge-base --is-ancestor "$LAST_DEPLOYED" "$EXPECTED_FEATURE_HEAD"; then
            echo "❌ Refusing recovery: last deployed revision is not an ancestor of the preserved feature history"
            exit 1
          fi

          mkdir -p "$BACKUP_DIR"
          printf '%s\n' \
            "local_head_before=$ACTUAL_HEAD" \
            "verified_remote_feature_head=$REMOTE_FEATURE_HEAD" \
            "feature_branch=$FEATURE_BRANCH" \
            "last_verified_deployed_revision=$LAST_DEPLOYED" \
            "created_utc=$STAMP" \
            > "$BACKUP_DIR/metadata.txt"
          git log -1 --format=fuller "$EXPECTED_FEATURE_HEAD" > "$BACKUP_DIR/feature-head.txt"
          chmod -R go-rwx "$BACKUP_DIR"

          # Detach first so the local feature branch ref is never moved.
          git checkout --detach "$LAST_DEPLOYED"
          git reset --hard "$LAST_DEPLOYED"

          if [ "$(git rev-parse HEAD)" != "$LAST_DEPLOYED" ]; then
            echo "❌ Recovery checkout mismatch"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "❌ Recovery did not produce a clean tracked deploy checkout"
            git status --short --untracked-files=no
            exit 1
          fi

          echo "✅ Feature work preserved remotely at $FEATURE_BRANCH@$EXPECTED_FEATURE_HEAD"
          echo "✅ Recovery metadata preserved at $BACKUP_DIR"
          echo "✅ Runtime deploy checkout restored clean/detached at $LAST_DEPLOYED"
