name: One-off report target ledger closure

on:
  push:
    branches: [security/closure-update-authority-h123-ci]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/closure-update-authority-h123-ci
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact target-ledger patch
        run: python tools/oneoff_patch_report_target_ledger.py
      - name: Compile and inspect contract
        run: |
          python -m py_compile headend/main.py headend/services/update_authority.py
          python - <<'PY'
          from pathlib import Path
          source = Path('headend/main.py').read_text(encoding='utf-8')
          assert 'authorized_target = db.query(UpdateTarget).filter_by(' in source
          assert 'resolved_target_ids = {target.device_id for target in _resolve_update_targets(db, u)}' in source
          assert 'report_inventory = db.query(DeviceInventory)' not in source[source.index('def report_update('):source.index('def report_available_updates(')]
          print('report target-ledger source contract passed')
          PY
      - name: Remove one-off machinery and commit result
        run: |
          rm .github/workflows/oneoff-report-target-ledger.yml tools/oneoff_patch_report_target_ledger.py
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bind update reports to durable target ledger'
          git push origin HEAD:security/closure-update-authority-h123-ci
