name: One-off technician auth XSS closure

on:
  push:
    branches:
      - security/closure-technician-auth-xss

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/closure-technician-auth-xss
          fetch-depth: 0

      - name: Prepare focused tests
        run: python3 -m pip install pytest

      - name: Patch technician auth boundary and rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('headend/main.py')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'from services.bootstrap_security import resolve_initial_admin_password\n',
              'from services.bootstrap_security import resolve_initial_admin_password\n'
              'from services.technician_auth_security import html_text, validate_technician_device_id\n',
              'technician auth security import',
          )

          replace_once(
              '''    from database import Device\n\n    # Verify device exists\n    device = db.query(Device).filter_by(device_id=req.device_id).first()\n    if not device:\n        log.warning("Technician auth start for unknown device: %s", req.device_id)\n        # Still allow - device might not be provisioned yet\n''',
              '''    from database import Device\n\n    # This endpoint is intentionally unauthenticated because an Edge starts the\n    # QR challenge.  Treat device_id as protocol data, not free-form display\n    # text, before it reaches DB queries, logs or the pending-session store.\n    try:\n        device_id = validate_technician_device_id(req.device_id)\n    except ValueError as exc:\n        raise HTTPException(status_code=422, detail="Ugyldigt device_id") from exc\n\n    # Verify device exists\n    device = db.query(Device).filter_by(device_id=device_id).first()\n    if not device:\n        log.warning("Technician auth start for unknown device: %s", device_id)\n        # Still allow - device might not be provisioned yet\n''',
              'start boundary validation',
          )

          replace_once(
              '''        "device_id": req.device_id,\n''',
              '''        "device_id": device_id,\n''',
              'pending session device id',
          )

          replace_once(
              '''    log.info("Technician auth started: %s for device %s", session_id[:8], req.device_id)\n''',
              '''    log.info("Technician auth started: %s for device %s", session_id[:8], device_id)\n''',
              'validated device log',
          )

          replace_once(
              '''    return HTMLResponse(\n        f"""\n''',
              '''    # Defense in depth: sessions are ephemeral, but render all stored device\n    # identifiers as escaped text even though new sessions are allowlist-validated.\n    safe_device_id = html_text(session.get("device_id", "Ukendt"))\n\n    return HTMLResponse(\n        f"""\n''',
              'landing page escaped display value',
          )

          replace_once(
              '''                        <strong>Enheds ID:</strong> {session.get('device_id', 'Ukendt')}<br>\n''',
              '''                        <strong>Enheds ID:</strong> {safe_device_id}<br>\n''',
              'landing page raw interpolation',
          )

          path.write_text(source, encoding='utf-8')
          PY

          python3 -m py_compile headend/main.py headend/services/technician_auth_security.py
          PYTHONPATH=headend:. python3 -m pytest tests/test_technician_auth_xss_closure.py tests/test_technician_auth_grant_migration.py -q
          git diff --check

      - name: Commit focused closure
        shell: bash
        run: |
          git config user.name "TimeLapse Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add headend/main.py
          git diff --cached --check
          git commit -m "Escape and validate technician auth device IDs"
          git push origin HEAD:security/closure-technician-auth-xss
