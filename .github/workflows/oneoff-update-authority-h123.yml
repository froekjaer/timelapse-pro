name: One-off update authority H-1 H-2 H-3 closure

on:
  push:
    branches: [security/closure-update-authority-h123]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/closure-update-authority-h123
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply scoped authority patch
        run: python tools/oneoff_patch_update_authority.py
      - name: Compile and run focused contracts
        run: |
          python -m py_compile headend/main.py headend/services/update_authority.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          test_path = Path('tests/test_update_authority_scope_environment.py')
          spec = importlib.util.spec_from_file_location('authority_contracts', test_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tests = [
              mod.test_customer_and_site_scopes_reach_matching_device,
              mod.test_scope_mismatch_fails_closed,
              mod.test_environment_isolation_blocks_test_update_from_production,
              mod.test_lab_rd_dev_aliases_are_test_environment,
              mod.test_unknown_device_environment_fails_closed,
              mod.test_explicit_target_list_never_bypasses_environment,
              mod.test_main_policy_and_report_use_same_canonical_predicate,
          ]
          for test in tests:
              test()
          print(f'{len(tests)} focused authority contracts passed')
          PY
      - name: Remove one-off machinery and commit result
        run: |
          rm .github/workflows/oneoff-update-authority-h123.yml tools/oneoff_patch_update_authority.py
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bind update policy and reports to canonical scope and environment authority'
          git push origin HEAD:security/closure-update-authority-h123
