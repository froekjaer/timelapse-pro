name: One-off update lifecycle closure

on:
  push:
    branches: [fix/update-rollback-idempotency]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/update-rollback-idempotency
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply scoped update lifecycle patch
        run: python tools/oneoff_patch_update_lifecycle.py
      - name: Compile patched Edge update code
        run: python -m py_compile edge/agent.py edge/update_lifecycle.py
      - name: Remove one-off machinery and commit result
        run: |
          rm .github/workflows/oneoff-update-lifecycle-closure.yml tools/oneoff_patch_update_lifecycle.py
          git config user.name 'TimeLapse Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make Edge update reporting idempotent and rollback verifiable'
          git push origin HEAD:fix/update-rollback-idempotency
