# ═══════════════════════════════════════════════════════════════════════════════
# TimeLapse Pro Fail2ban Konfiguration
# Version: 1.0.0 | 2026-07-07
# ────────────────────────────────────────────────────────────────────────────────
# Filplacering:
#   Jail config: /etc/fail2ban/jail.d/timelapse-pro.local
#   Filter config: /etc/fail2ban/filter.d/timelapse-pro.conf
#
# Aktivér ændringer med:
#   sudo fail2ban-client reload
#
# Tjek status med:
#   sudo fail2ban-client status
# ═══════════════════════════════════════════════════════════════════════════════

# ── Jail konfiguration (timelapse-pro.local) ───────────────────────────────────────
[nginx]
enabled   = true
port      = http,https
filter    = nginx
logpath   = /opt/homebrew/var/log/nginx/access.log
maxretry  = 5
findtime  = 600
bantime   = 3600
action    = iptables-multiport[name=nginx, port="http,https", protocol=tcp]

[sshd]
enabled   = true
port      = ssh
filter    = sshd
logpath   = /var/log/system.log
maxretry  = 3
findtime  = 600
bantime   = 3600
action    = iptables[name=SSH, port=ssh, protocol=tcp]

# Custom TimeLapse Pro API jail
[timelapse-api]
enabled   = true
port      = http,https
filter    = timelapse-api
logpath   = /opt/homebrew/var/log/nginx/access.log
maxretry  = 10
findtime  = 600
bantime   = 7200
action    = iptables-multiport[name=timelapse-api, port="http,https", protocol=tcp]

# ── Filter konfiguration (timelapse-pro.conf) ──────────────────────────────────────
[Definition]
# Fail regex for TimeLapse Pro API
# Blokerer IPs med for mange failed login forsøg

# Failed authentication (401 Unauthorized)
failregex = ^<HOST> .* "(GET|POST|PUT|DELETE) /api/.*" 401 .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE) /api/(auth/login|admin/.*|lab/.*)" 403 .*$

# Ignore legitimate traffic
ignoreregex = ^<HOST> .* "(GET|POST) /api/health" 200
             ^<HOST> .* "GET /api/thumbnails/.*" 200

# ── Parameter forklaring ───────────────────────────────────────────────────────────
# maxretry:  Antal failed forsøg før ban
# findtime: Tidsvindue i sekunder at tælle failed forsøg
# bantime:  Hvor længe (i sekunder) IP er bannet
#
# Eksempler:
#   maxretry=5, findtime=600 (10 min) = 5 fejl inden for 10 min
#   bantime=3600 = 1 times ban
#   bantime=86400 = 24 timers ban

# ── Standard værdier for TimeLapse Pro ─────────────────────────────────────────────
# Web UI login (nginx jail):
#   - 5 fejl inden for 10 minutter = 1 times ban
#
# SSH login (sshd jail):
#   - 3 fejl inden for 10 minutter = 1 times ban
#
# API abuse (timelapse-api jail):
#   - 10 fejl inden for 10 minutter = 2 timers ban

# ── IPs der altid ignoreres (whitelist) ──────────────────────────────────────────
# Tilføj til jail konfiguration:
# ignoreip = 127.0.0.1/8 ::1
# ignoreip = 192.168.86.0/24  # Lokalt netværk

# ── Test og verifikation ───────────────────────────────────────────────────────────
# Se aktive bans:
#   sudo fail2ban-client status nginx
#   sudo fail2ban-client status sshd
#   sudo fail2ban-client status timelapse-api
#
# Unban en IP:
#   sudo fail2ban-client set nginx unbanip <IP>
#
# Se fail2ban log:
#   tail -f /opt/homebrew/var/log/fail2ban.log

# ── Integration med TimeLapse Pro ───────────────────────────────────────────────────
# Fail2ban integreres med TimeLapse Pro via:
# 1. Nginx access log (API endpoints)
# 2. System log (SSH)
# 3. SIEM logging (hvis aktiveret)
