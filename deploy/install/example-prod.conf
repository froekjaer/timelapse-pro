# Eksempel-konfiguration til install_headend.sh — PRODUKTION
# Kopiér denne fil, tilpas værdierne, og kør:
#   sudo ./install_headend.sh --config /sti/til/din-kopi.conf
#
# VIGTIGT: dette script rører kun headend/nginx/DB på DENNE maskine. Certifikat
# (§6, DNS-01) og det allerførste RBAC-login (§7) skal du gøre manuelt bagefter
# — se INSTALLATION_GUIDE_HEADEND_v1.md. Ingen agent (Claude/Codex) må
# nogensinde få adgang til denne maskine, jf.
# MILJOE_ARKITEKTUR_RD_STAGING_PROD_v1.md §5.
#
# VIGTIGT (rettet 2026-07-05): denne Mac Mini kører allerede CrushFTP, som
# optager 21/22/80/443 — TimeLapse Pro's nginx må ALDRIG binde til disse porte
# her. Se PORT_AUDIT_og_WEBSITE_v10.md §3/§4 for den fulde begrundelse.
#
# Har I flere prod-servere i fremtiden (fx pr. stor kunde, eller for skalering):
# kopiér denne fil igen med et nyt domænenavn/DB-navn — scriptet er skrevet til
# at kunne køres flere gange på flere maskiner uden ændring af selve scriptet.

TL_ENV=prod

# UI+API-domænet — det kunder/admins rent faktisk logger ind på.
TL_DOMAIN_BACKEND=backend.timelapse-pro.dk

# Ikke-standard port, da CrushFTP ejer 443 på denne maskine. 8443 er bekræftet
# Cloudflare-proxy-kompatibel HTTPS-port (se PORT_AUDIT_og_WEBSITE_v10.md §4).
TL_BACKEND_PORT=8443

# Marketingsitet (www/index.html i repoet, hjemmesiden timelapse-pro.dk) hostes
# BEVIDST IKKE på denne maskine — CrushFTP-portkonflikten gør det unødvendigt
# kompliceret, og det er slet ikke nødvendigt: statiske sites har ingen
# afhængighed af backend-maskinen. Host det separat (fx Cloudflare Pages eller
# anden statisk hosting) og peg dets login-knapper på
# https://backend.timelapse-pro.dk:8443/ — se PORT_AUDIT_og_WEBSITE_v10.md §5.3.
# Der er derfor ingen TL_DOMAIN_WWW-nøgle i dette script.

# Skal være identisk med generatorens --destination: den GPG-verificerede,
# detached release — aldrig en almindelig arbejdskopi.
TL_REPO_DIR=/Users/Shared/TimeLapsePro/releases/prod

# Hvor billeder/captures skal ligge på denne maskine — brug en sti med god
# diskplads/redundans, IKKE samme volumen som R&D-maskinens /Volumes/data-fast.
TL_DATA_DIR=/Users/Shared/TimeLapsePro/data/canonical-images

TL_DB_NAME=timelapse_db
TL_DB_USER=timelapse
TL_SERVICE_USER=_timelapse
TL_SERVICE_GROUP=_timelapse
TL_SERVICE_HOME=/var/lib/timelapse
TL_TUNNEL_HOST=backend.timelapse-pro.dk
TL_TUNNEL_PORT=22222
TL_TUNNEL_USER=tunnel
