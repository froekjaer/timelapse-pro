# Eksempel-konfiguration til install_headend.sh — STAGING
# Kopiér denne fil, tilpas værdierne, og kør:
#   sudo ./install_headend.sh --config /sti/til/din-kopi.conf
#
# Staging er tænkt som software-parity-gate med prod (kun samme softwarelag som
# prod, ingen R&D-only værktøjer) — se MILJOE_ARKITEKTUR_RD_STAGING_PROD_v1.md.
# Kapaciteten på iMac'en er IKKE bekræftet endnu — kør evt. først med --dry-run.

TL_ENV=staging

# Vælg selv et internt/midlertidigt domænenavn til staging, eller brug en
# lokal /etc/hosts-indgang hvis I ikke vil bruge et rigtigt offentligt domæne
# til staging (ingen kunder rammer denne maskine).
TL_DOMAIN_BACKEND=staging.timelapse-pro.dk

# VIGTIGT (rettet 2026-07-05): denne iMac kører allerede CrushFTP, som optager
# 21/22/80/443 — TimeLapse Pro's nginx må ALDRIG binde til disse porte her.
# Backend kører derfor på en ikke-standard, direkte-offentlig port. 8443 er
# bekræftet Cloudflare-proxy-kompatibel (se PORT_AUDIT_og_WEBSITE_v10.md §4).
TL_BACKEND_PORT=8443

# Marketingsitet (www.timelapse-pro.dk) er IKKE en del af dette script —
# det hostes altid separat fra CrushFTP-maskinerne, se
# PORT_AUDIT_og_WEBSITE_v10.md §5.3. Der er derfor ingen TL_DOMAIN_WWW-nøgle.

# Sti til klonet repo PÅ DENNE MASKINE (ikke R&D-maskinens sti).
TL_REPO_DIR=/Users/peter/projects/timelapse-pro

# Hvor billeder/captures skal ligge på denne maskine.
TL_DATA_DIR=/Users/peter/timelapse-data/canonical-images

TL_DB_NAME=timelapse_db
TL_DB_USER=timelapse
