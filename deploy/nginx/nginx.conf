user peter staff;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format timelapse '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
    access_log /opt/homebrew/var/log/nginx-timelapse-access.log timelapse;
    error_log  /opt/homebrew/var/log/nginx-timelapse-error.log warn;
    client_body_temp_path /opt/homebrew/var/run/nginx-client-body-temp;

    limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 2026-08-06 (Claude): TLS-hærdning — sat én gang her, arves af alle ssl-server-
    # blokke nedenfor. ssl_prefer_server_ciphers sikrer serverens cipher-rækkefølge
    # (HIGH:!aNULL:!MD5) vinder over klientens; session cache/timeout undgår en fuld
    # TLS-handshake ved gentagne requests fra samme klient inden for 10 minutter.
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen 80;
        server_name timelapse.froekjaer.dk;

        location ^~ /.well-known/acme-challenge/ {
            root /private/tmp/timelapse-acme-webroot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name openwebui.froekjaer.dk;

        location ^~ /.well-known/acme-challenge/ {
            root /private/tmp/timelapse-acme-webroot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name openwebui.froekjaer.dk;

        ssl_certificate     /opt/homebrew/etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /_timelapse_openwebui_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/api/openwebui/access/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie            $http_cookie;
            proxy_set_header Host              timelapse.froekjaer.dk;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /ws/ {
            auth_request /_timelapse_openwebui_auth;
            auth_request_set $timelapse_user_email $upstream_http_x_timelapse_user_email;
            auth_request_set $timelapse_user_name  $upstream_http_x_timelapse_user_name;
            auth_request_set $timelapse_user_role  $upstream_http_x_timelapse_user_role;
            error_page 401 403 = @openwebui_ws_denied;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Timelapse-User-Email $timelapse_user_email;
            proxy_set_header X-Timelapse-User-Name  $timelapse_user_name;
            proxy_set_header X-Timelapse-User-Role  $timelapse_user_role;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
            proxy_cookie_flags ~ secure httponly samesite=lax;
        }

        location / {
            auth_request /_timelapse_openwebui_auth;
            auth_request_set $timelapse_user_email $upstream_http_x_timelapse_user_email;
            auth_request_set $timelapse_user_name  $upstream_http_x_timelapse_user_name;
            auth_request_set $timelapse_user_role  $upstream_http_x_timelapse_user_role;
            error_page 401 403 = @openwebui_denied;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Timelapse-User-Email $timelapse_user_email;
            proxy_set_header X-Timelapse-User-Name  $timelapse_user_name;
            proxy_set_header X-Timelapse-User-Role  $timelapse_user_role;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
            proxy_cookie_flags ~ secure httponly samesite=lax;
        }

        location @openwebui_denied {
            return 302 https://timelapse.froekjaer.dk/openwebui;
        }

        location @openwebui_ws_denied {
            return 401;
        }
    }

    # 2026-08-06 (Claude): REVERTERET — marketingsiden på :443 forvirrede Peters normale
    # login-adgang (hans vante URL viste pludselig marketingsiden, ikke login). App'en er
    # tilbage på :443 præcis som før i aften. Marketingside-på-forsiden-idéen droppet for
    # nu — kan tages op igen som en bevidst, planlagt ændring med tid til at opdatere
    # bogmærker/vaner, ikke midt i en travl session.
    server {
        listen 443 ssl;
        server_name timelapse.froekjaer.dk;

        ssl_certificate     /opt/homebrew/etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://timelapse.froekjaer.dk https://openwebui.froekjaer.dk; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        root /Volumes/data-fast/peter-home/projects/timelapse-pro/timelapse-ui/dist;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ~ ^/api/auth/login {
            limit_req zone=api_login burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }

# X-Accel: intern location — nginx sender thumbnail/billede-filer direkte
    # (kun via X-Accel-Redirect efter Python-auth; ikke tilgængelig udefra).
    location /_protected_media/ {
        internal;
        alias /Volumes/data-fast/timelapse-incoming/canonical-images/;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
# Thumbnails + billeder: auth-beskyttet, read-only media → UNDTAGET rate-limit
    # (data-API'et beholder sin limit_req; kun media slipper fri). ^~ vinder over
    # regex-locations og arver derfor IKKE limit_req fra 'location /api/'.
    location ^~ /api/thumbnails/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }
    location ^~ /api/images/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }
        # Import af historiske billeder kan uploade store ZIP-filer.
        # Uden dette afviser nginx med 413 (HTML-side), som i UIet viste sig
        # som Safari-fejlen "The string did not match the expected pattern".
        location /api/import/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            client_max_body_size 128m;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }
    }

    # 2026-08-06 (Claude, P0-02 dry-run — se Dokumentation/PORT_AUDIT_og_WEBSITE_v10.md §4/§5.4):
    # Denne maskine er R&D Headend, ikke staging/prod — der er INGEN CrushFTP-portkonflikt her
    # (bekræftet: kun nginx bruger 80/443, ingen CrushFTP-proces kører overhovedet). §4-planens
    # egentlige domæne (backend.timelapse-pro.dk) og separate cert findes ikke på denne maskine,
    # så denne blok genbruger det eksisterende timelapse.froekjaer.dk-certifikat udelukkende for
    # at teste selve 8443-mekanikken. App'en kører nu identisk på BÅDE :443 (normal adgang,
    # ovenfor) og :8443 (P0-02-dry-run) — additiv, ingen af dem afhænger af den anden.
    server {
        listen 8443 ssl;
        server_name timelapse.froekjaer.dk;

        ssl_certificate     /opt/homebrew/etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://timelapse.froekjaer.dk:8443 https://openwebui.froekjaer.dk; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        root /Volumes/data-fast/peter-home/projects/timelapse-pro/timelapse-ui/dist;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ~ ^/api/auth/login {
            limit_req zone=api_login burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }

        location ^~ /api/thumbnails/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }
        location ^~ /api/images/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location /api/import/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            client_max_body_size 128m;
            proxy_pass http://127.0.0.1:8000;
            proxy_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie            $http_cookie;
        }
    }
}
