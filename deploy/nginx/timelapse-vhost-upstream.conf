# TimeLapse Pro vhost-only nginx snippet for a shared production reverse proxy.
#
# This file is intentionally NOT a complete nginx.conf. Include/adapt it in the
# existing public reverse proxy that already owns TCP/80 and TCP/443.
#
# Example hostname split on the same public IP:
#   ftp.hyldager.net       -> existing file sharing system
#   timelapse.hyldager.net -> TimeLapse Pro UI/API
#   openwebui.hyldager.net -> Open WebUI, protected by TimeLapse MFA
#
# Replace certificate paths and hostnames before production use.

map $http_upgrade $timelapse_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream timelapse_headend_api {
    server 127.0.0.1:8000;
}

upstream timelapse_openwebui {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name timelapse.hyldager.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name timelapse.hyldager.net;

    ssl_certificate     /etc/letsencrypt/live/timelapse.hyldager.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timelapse.hyldager.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/timelapse-pro/timelapse-ui/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 128m;
        proxy_pass http://timelapse_headend_api;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie            $http_cookie;
    }
}

server {
    listen 80;
    server_name openwebui.hyldager.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name openwebui.hyldager.net;

    ssl_certificate     /etc/letsencrypt/live/timelapse.hyldager.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timelapse.hyldager.net/privkey.pem;

    location = /_timelapse_openwebui_auth {
        internal;
        proxy_pass http://timelapse_headend_api/api/openwebui/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Host              timelapse.hyldager.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        auth_request /_timelapse_openwebui_auth;
        error_page 401 403 = @openwebui_denied;
        proxy_pass http://timelapse_openwebui;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $timelapse_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie            $http_cookie;
    }

    location @openwebui_denied {
        return 302 https://timelapse.hyldager.net/openwebui;
    }
}
