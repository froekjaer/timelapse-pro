# TimeLapse Pro — dedicated remote ADMIN SSH for the Headend (TCP/9122)
#
# The only remote shell path to the Headend (Peter, 2026-10-01).
# Login = macOS password + TOTP code, BOTH asked during authentication via
# PAM keyboard-interactive (/etc/pam.d/sshd: pam_opendirectory +
# pam_google_authenticator, root-owned copy in /usr/local/lib/pam). Because
# the second factor is part of authentication, nothing — shell, command or
# forward — is reachable with the password alone.
# The only forward allowed is local -> 127.0.0.1:5900 (Screen Sharing).
# Rendered and installed by install_timelapse_admin_sshd.sh
# (__ADMIN_USER__ is replaced at install time).
Port 9122
# IPv4 only: public exposure is controlled solely by the router's IPv4 NAT
# forward. No IPv6 listener, so a global IPv6 address/AAAA record can never
# expose 9122 behind the operator's back.
ListenAddress 0.0.0.0
HostKey /etc/ssh/timelapse-admin/ssh_host_ed25519_key
PidFile /etc/ssh/timelapse-admin/sshd.pid

AllowUsers __ADMIN_USER__
PermitRootLogin no

UsePAM yes
KbdInteractiveAuthentication yes
PasswordAuthentication no
PubkeyAuthentication no
AuthenticationMethods keyboard-interactive
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 4
MaxStartups 4:50:10
LoginGraceTime 60
PerSourcePenalties authfail:120s noauth:30s invaliduser:120s max:1h

AllowTcpForwarding local
PermitOpen 127.0.0.1:5900 localhost:5900
PermitListen none
GatewayPorts no
AllowStreamLocalForwarding no
PermitTunnel no
X11Forwarding no
AllowAgentForwarding no
PermitUserRC no
PermitUserEnvironment no
PermitTTY yes

ClientAliveInterval 120
ClientAliveCountMax 3
LogLevel VERBOSE
