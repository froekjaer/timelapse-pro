# TimeLapse Pro SSH/SFTP hardening profile.
#
# Intent:
# - TimeLapse SFTP ingress uses TCP/22222 only.
# - Site upload users are named sftp_* and must not be usable on shared SSH
#   ports such as 22 or 2222.
# - Human/admin SSH and reverse-debug tunnels must be configured separately
#   from site upload accounts.
#
# Install on macOS headend:
#   1. Remove the old broad "Match User sftp_*" block from /etc/ssh/sshd_config.
#   2. Append this block at the END of /etc/ssh/sshd_config.
#   3. Reload the dedicated launchd socket.
#
# Do not place this file under /etc/ssh/sshd_config.d/ on macOS while the
# system Include directive is at the top of sshd_config. Match blocks are
# parsed inline, so an early Include can accidentally place the rest of the
# main file inside a Match context.
#
# The dedicated launchd socket should listen on 22222:
#   /Library/LaunchDaemons/ssh-2222.plist -> Sockets:Listeners:SockServiceName = 22222

# Explicitly reject TimeLapse site upload users on shared/non-TimeLapse ports.
Match User sftp_* LocalPort 22
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    ForceCommand /usr/bin/false
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no

Match User sftp_* LocalPort 2222
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    ForceCommand /usr/bin/false
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no

# Default deny on the dedicated SFTP port.
#
# Site-specific allow rules must be generated from Headend DB with:
#   python headend/tools/render_sftp_rbac_config.py --output /private/tmp/timelapse-sftp-rbac-sites.conf
#
# The generated block binds each sftp_user to one canonical customer/site
# directory. Keep this default-deny block after the generated per-site allow
# blocks, or apply the generated file as the final TimeLapse SFTP section.
Match User sftp_* LocalPort 22222
    ForceCommand /usr/bin/false
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    PermitTTY no
