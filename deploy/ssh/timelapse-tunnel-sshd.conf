# TimeLapse Pro — dedicated reverse-SSH tunnel ingress (TCP/22022)
#
# Canonical authority: froekjaer/timelapse-pro → deploy/ssh/timelapse-tunnel-sshd.conf
# Installed to:        /etc/ssh/timelapse-tunnel/sshd_config
# Installed by:        deploy/ssh/install_timelapse_tunnel_sshd.sh (root)
#
# This sshd instance serves ONE purpose: terminating Edge reverse-SSH control
# connections (ssh -N -R …) for the timelapse_tunnel service identity.
# It shares NOTHING with the admin sshd on 22/22222 except the sshd binary:
# separate config, separate host keys (pinnable per Edge), separate account,
# separate launchd service. Do NOT add ports, users or subsystems here.
#
# Verified directive support: OpenSSH 10.3p1 (macOS 26.x headend, 2026-09-17).

# ── Listener ────────────────────────────────────────────────────────────────
Port 22022
ListenAddress 0.0.0.0
ListenAddress ::

# Dedicated host key so Edges pin THIS instance's identity, independent of the
# admin sshd host keys on 22/22222. Generated by the installer, never committed.
HostKey /etc/ssh/timelapse-tunnel/ssh_host_ed25519_key
PidFile /etc/ssh/timelapse-tunnel/sshd.pid

# ── Identity: exactly one account, public-key only ──────────────────────────
AllowUsers timelapse_tunnel
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
AuthorizedKeysFile /etc/ssh/timelapse-tunnel/authorized_keys
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 30

# ── Tunnel-only posture ─────────────────────────────────────────────────────
# No interactive shell, no PTY, no X11, no agent forwarding, no user env/rc.
# ForceCommand /usr/bin/false makes ANY requested command (incl. shell and
# sftp) a no-op; ssh -N reverse-tunnel sessions are unaffected.
PermitTTY no
X11Forwarding no
AllowAgentForwarding no
PermitUserRC no
PermitUserEnvironment no
ForceCommand /usr/bin/false

# Forwarding: remote-only, loopback-bound, per-device port allowlist.
#   AllowTcpForwarding remote  → local (-L) and dynamic (-D) forwards are
#                                refused for this account entirely.
#   PermitOpen none            → belt-and-braces: no local forward destination
#                                is permitted even if a future OpenSSH change
#                                alters AllowTcpForwarding semantics.
#   GatewayPorts no            → remote forwards (-R) bind 127.0.0.1 on the
#                                headend ONLY, never all interfaces.
#   PermitListen any           → the per-key authorized_keys entries carry the
#                                real allowlist (restrict,permitlisten=…), one
#                                fixed loopback port per Edge device key.
#                                authorized_keys restrictions can only narrow
#                                this, never broaden it.
AllowTcpForwarding remote
PermitOpen none
GatewayPorts no
PermitListen any

# ── Session hygiene ─────────────────────────────────────────────────────────
ClientAliveInterval 60
ClientAliveCountMax 3
Compression yes
TCPKeepAlive yes
LogLevel VERBOSE
# No Subsystem directive on purpose: no sftp on the tunnel ingress.
# UsePAM is intentionally absent (not a supported directive on macOS sshd).

# NOTE — deliberate omissions, do not "fix":
#  * DisableForwarding would also kill remote forwarding and is therefore
#    WRONG here; least-privilege is achieved by the combination above.
#  * No Match blocks in this file (avoids the macOS Include/Match ordering
#    pitfall documented in timelapse-sshd-sftp.conf).
