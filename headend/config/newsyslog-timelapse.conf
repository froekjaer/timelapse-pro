# TimeLapse Pro — log rotation (macOS newsyslog)
# Placeres i /etc/newsyslog.d/timelapse.conf
#
# Format: logfile [owner:group] mode count size when flags [/pidfile] [sigtype]
# when: @T00 = daglig midnat
# flags: J = bzip2-komprimering, G = glob

# Headend stdout/stderr (launchd redirect)
/Users/peter/Library/Logs/timelapse-headend.log   peter:staff  640  30  *  @T00  J

# Headend Python logger (TimedRotatingFileHandler håndterer dette selv,
# men newsyslog sikrer oprydning hvis Python-rotation fejler)
/Users/peter/Library/Logs/timelapse/headend.log   peter:staff  640  30  *  @T00  J
