# TimeLapse Pro — Hardware target: OrangePi PC Plus
# SoC: Allwinner H3 (4x Cortex-A7 @ 1.6GHz, Mali-400 GPU)
# Arch: armhf (ARM 32-bit hard-float) — VIGTIGT: IKKE arm64!
# Boot: U-Boot (SPL) → Armbian kernel
# Base OS: Armbian Jammy (Ubuntu 22.04, headless minimal)

id: orangepi-pc-plus
display_name: "OrangePi PC Plus"
arch: armhf
docker_platform: linux/arm/v7
docker_base: arm32v7/debian:trixie
hal_class: orangepi
soc: Allwinner_H3

base_image:
  # Armbian rolling release for OrangePi PC Plus — Debian 13 Trixie Minimal
  # Download fra: https://www.armbian.com/orange-pi-pc-plus/
  # URL er rolling (ingen version i URL) — følger redirect til aktuelt image.
  # Kræver arm32v7/debian:trixie som Docker-base (Python 3.12 match).
  type: armbian
  url: "https://dl.armbian.com/orangepipcplus/Trixie_current_minimal"
  filename: "Armbian_community_26.8.0-trunk.170_Orangepipcplus_trixie_current_6.18.35_minimal.img.xz"
  # Rolling URL er kun tilladt, så længe den leverer præcis dette reviewede archive.
  sha256: "7f0a35f496021e7649ae4d139a21414470645196f9a41a779092a6a1f2a3ca72"
  extract: xz
  # Armbian Allwinner layout:
  #   Sektor 0-2048:  U-Boot SPL (direkte på disk — ingen partition)
  #   Partition p1:   ext4 rootfs (inkl. /boot med dtb + uImage)
  # root_partition: 1 (IKKE p2 — Armbian minimal har kun én partition!)
  boot_partition: null
  root_partition: 1

wifi_method: wpa_supplicant
# Armbian Trixie (Debian) bruger wpa_supplicant til WiFi-konfiguration

boot_method: uboot

extra_packages: []

# HAL-detektions-strenge
device_tree_model_patterns:
  - "allwinner sun8i"
  - "orangepi pc plus"
  - "orange pi pc plus"
  - "xunlong orange pi pc plus"

# Agentstier
agent_install:
  agent_dir: /opt/timelapse/edge
  venv_dir:  /opt/timelapse/venv
  data_dir:  /data
  config_dir: /etc/timelapse
  service_name: timelapse-edge

notes: |
  VIGTIGT: OrangePi PC Plus er 32-bit (armhf).
  Docker-base er arm32v7/ubuntu:22.04 — IKKE arm64v8.
  opencv-python-headless installeres post-flash via headend OS-bundle.
  Ingen CSI-support (kun USB-kamera).
  4GB onboard eMMC kan bruges som boot-medie i stedet for SD-kort.
