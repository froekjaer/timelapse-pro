# TimeLapse Pro — Hardware target: OrangePi 4 Pro
# SoC: Rockchip RK3399 (2x Cortex-A72 + 4x Cortex-A53 @ 2.0GHz / 1.5GHz)
# GPU: Mali-T860MP4
# NPU: ingen
# Arch: arm64 (aarch64)
# Boot: SPI Flash (U-Boot) → NVMe SSD (via nand-sata-install)
# Base OS: OrangePi official Ubuntu Jammy Server
#
# VIGTIGT: Brug officielt OrangePi-image — Armbian mangler RK3399-NPU-support.

id: orangepi4pro
display_name: "OrangePi 4 Pro"
arch: arm64
docker_platform: linux/arm64
docker_base: arm64v8/ubuntu:22.04
hal_class: orangepi
soc: RK3399

base_image:
  # Officielt OrangePi Ubuntu Server image — kun tilgængeligt via Google Drive.
  # Fil-ID: 1apQbbhY-uUAG8495FMkarRTDK-B6UTbw
  # Download-side: https://drive.google.com/drive/folders/1TcFAGTblG_gbDhwFotEWS0y78LwHA-VG
  type: orangepi
  url: "https://drive.google.com/file/d/1apQbbhY-uUAG8495FMkarRTDK-B6UTbw/view?usp=share_link"
  filename: null   # gdown auto-detekterer filnavn fra Google Drive metadata
  sha256: null
  extract: 7z
  # OrangePi 4 Pro Linux-image har KUN én partition (ext4 rootfs).
  # Ingen separat boot-partition — kernel + dtb ligger i /boot på rootfs.
  # Bekræftet i User Manual v1.4 side 59: /dev/mmcblk0p1 er rootfs.
  boot_partition: null
  root_partition: 1

wifi_method: netplan
# Ubuntu Jammy (OP4Pro officielt image) bruger netplan + networkd til WiFi

boot_method: uboot_spiflash
# U-Boot i SPI Flash (128Mb onboard). System på NVMe SSD.
# Flash-workflow:
#   1. Flash dette image til SD-kort med balenaEtcher
#   2. Boot fra SD → sudo nand-sata-install → "Boot from SPI - system on NVMe"
#   3. Bootloader til SPI Flash, rootfs til NVMe
#   4. Fjern SD, boot fra NVMe

extra_packages:
  # Kamera (Canon EOS 1300D, Nikon m.fl.) via USB PTP/MTP
  - gphoto2
  - libgphoto2-6
  - libgphoto2-port12
  # GPS (u-blox og andre NMEA USB-enheder)
  - gpsd
  - gpsd-clients
  - python3-gps
  # SSH reverse tunnel (edge → headend)
  - autossh
  # Bluetooth remote management
  - bluez
  - bluez-tools
  - python3-dbus

device_tree_model_patterns:
  - "orangepi 4 pro"
  - "orange pi 4 pro"
  - "rk3399"

agent_install:
  agent_dir: /opt/timelapse/edge
  venv_dir:  /opt/timelapse/venv
  data_dir:  /data
  config_dir: /etc/timelapse
  service_name: timelapse-edge

notes: |
  OrangePi 4 Pro (RK3399) — officielt OrangePi Ubuntu Jammy Server image.
  Kernel: linux5.15.x (RK3399 BSP — vendor-specifik fra OrangePi).
  GPIO relay pins: sysfs 356 (Kamera), 361 (Modem). Pin 2=VCC, Pin 6=GND.
  NVMe flash-workflow: flash til SD → boot → sudo nand-sata-install → boot fra NVMe.
  Image: https://drive.google.com/drive/folders/1TcFAGTblG_gbDhwFotEWS0y78LwHA-VG
