# ═══════════════════════════════════════════════════════════════════════════════
# pyproject.toml — TimeLapse Pro Python projekt configuration
# Version: 1.0.0 | 2026-07-07
# ────────────────────────────────────────────────────────────────────────────────
# Central konfiguration for pytest, black, ruff, mypy m.fl.
# ═══════════════════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers defineret i conftest.py men gentaget her for documentation
markers = [
    "integration: kræver live headend på TIMELAPSE_TEST_BASE_URL",
    "smoke: hurtig daglig/CI smoke-test for kernefunktionalitet",
    "unit: unit test der ikke kræver ekstern dependencies",
    # Weekend features markers
    "p203: P2-03 GDPR Redaction workflow (UI-010)",
    "p005: P0-05 Retention Policy",
    "p002: P2-02 Thumbnail Post-Processing",
    "m005: M-05 Agent-Lockdown Layer 2",
    "gdpr: GDPR relaterede tests",
    "retention: Retention policy tests",
    "drift: Drift-detection tests",
    "security: Sikkerheds-relaterede tests",
    "updates: Update UI scopes tests",
    "thumbnail: Thumbnail/Post-Processing tests",
    "database: Database schema tests",
    "high: Høj prioritet",
    "critical: Kritisk prioritet",
    "medium: Medium prioritet",
]

# Default behavior
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",  # vis alle results (r=fail, a=all)
]

# Coverage configuration (kræver pytest-cov)
[tool.coverage.run]
source = ["headend", "edge"]
omit = [
    "*/venv/*",
    "*/.venv/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
]

# ── Code Quality Tools ───────────────────────────────────────────────────────────

# Black (formatter)
[tool.black]
line-length = 119
target-version = ["py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.ruff_cache
    | \.venv
    | venv
    | __pycache__
    | build
    | dist
    | artifacts
)/
'''

# Ruff (linter)
[tool.ruff]
line-length = 119
target-version = "py312"

# Include alle Python filer
include = ["*.py", "*.pyi"]

# Excludes
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "artifacts",
]

# Enable rules
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]

# Ignore rules (kan justeres)
ignore = [
    "E501",   # line too long — håndteres af black
    "B008",   # do not perform function calls in argument defaults
    "W191",   # tab indentation
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ARG001", "S101"]  # tillad unused args i tests
"__init__.py" = ["F401"]  # tillad unused imports i __init__

# MyPy (type checker)
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "artifacts",
    "tests",
]
